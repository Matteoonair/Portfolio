<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable · VDN Social Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E0E">
<link rel="icon" href="/icon-b.svg" type="image/svg+xml">
<style>
@font-face{font-family:Figtree;src:url(/fonts/figtree.woff2) format("woff2");font-weight:300 900;font-display:swap}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;grid-template-rows:58px 1fr;background:#0E0E0E;color:#F2F2EF;font-family:Figtree,system-ui,sans-serif}
header{background:#0E0E0E;border-bottom:1px solid #2A2A28;display:flex;align-items:center;padding:0 40px}
header img{height:18px}
main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;padding:8px 40px 40px}
.pl{background:#1B1B1A;display:flex;align-items:center;justify-content:center;min-height:360px}
.pl span{font-size:clamp(90px,16vw,220px);font-weight:800;letter-spacing:-.04em;color:#3A3A38}
.tx{background:#171716;color:#F2F2EF;padding:44px 48px;display:flex;flex-direction:column;gap:16px;justify-content:center}
h1{margin:0;font-size:40px;line-height:1.05;letter-spacing:-.01em}
p{margin:0;font-size:17px;line-height:1.5;max-width:40ch}
a.b{display:inline-flex;align-items:center;height:44px;padding:0 18px;background:#F2F2EF;color:#111;border-radius:3px;text-decoration:none;font-weight:600;width:max-content}
a:focus-visible{outline:2px solid #9B7BFF;outline-offset:2px}
@media (max-width:760px){header{padding:0 20px}main{grid-template-columns:1fr;padding:6px 20px 30px}.pl{min-height:220px}.tx{padding:28px 22px}h1{font-size:32px}}
</style>
</head>
<body>
<header><a href="/"><img src="/logo/vdn-logo-court-blanc.svg" alt="VDN Social Studio"></a></header>
<main>
  <div class="pl" aria-hidden="true"><span>404</span></div>
  <div class="tx"><h1>Cette page n’existe pas.</h1><p>Elle a peut-être changé d’adresse. Les projets, eux, sont toujours là.</p><a class="b" href="/">Retour aux projets →</a></div>
</main>
</body>
</html>

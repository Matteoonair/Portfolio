<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable · VDN Social Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/icon-v.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,100..900,0..100&family=Inter:wght@400;600;700&display=swap">
<style>
:root{--coton:#F7F5F2;--graphite:#1C1C1E;--gris:#6E6E73;--gold:#FF6B35}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--coton);color:var(--graphite);font:400 17px/1.6 Inter,system-ui,sans-serif;padding:24px;overflow:hidden}
.halo{position:fixed;width:720px;height:720px;left:50%;top:50%;transform:translate(-50%,-50%);background:radial-gradient(closest-side,rgba(255,107,53,.45),rgba(255,143,177,.3) 45%,rgba(91,63,224,.18) 75%,transparent);filter:blur(30px);z-index:0}
main{position:relative;z-index:1;text-align:center;max-width:560px}
.vic{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:17px;background:var(--graphite);color:var(--coton);position:relative;font:900 48px/1 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100}
.vic i{position:absolute;width:6px;height:6px;border-radius:50%;background:var(--gold);top:10px;right:10px}
.lbl{display:block;margin-top:28px;font:700 13px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;color:var(--gris)}
h1{font:900 clamp(40px,8vw,72px)/1.02 Fraunces,Georgia,serif;font-variation-settings:'SOFT' 100;letter-spacing:-.02em;margin:12px 0 16px}
p{color:var(--gris);margin:0 0 28px}
a{display:inline-flex;align-items:center;gap:10px;background:var(--graphite);color:var(--coton);text-decoration:none;border-radius:999px;padding:14px 26px;font-weight:600}
a:hover{box-shadow:0 0 0 3px rgba(255,107,53,.35)}
</style>
</head>
<body>
<div class="halo" aria-hidden="true"></div>
<main>
  <span class="vic" aria-hidden="true">V<i></i></span>
  <span class="lbl">Erreur 404</span>
  <h1>Hors champ.</h1>
  <p>Cette page n'existe pas, ou elle a changé d'adresse. Les projets, eux, sont toujours là.</p>
  <a href="/">Retour au portfolio →</a>
</main>
</body>
</html>

<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page introuvable · VDN Social Studio</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="/icon-d.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Space+Mono:wght@400;700&display=swap">
<style>
:root{--sig:#BBA5FF;--noir:#0F0F0F;--blanc:#F3F1EC;--gris:#A09D96;--carton:#EDE7DA;--encre:#171513}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--noir);color:var(--blanc);font:400 17px/1.6 Archivo,Arial,sans-serif;padding:24px}
main{text-align:center;max-width:620px}
.tag{display:inline-block;background:var(--carton);color:var(--encre);border-radius:4px;padding:14px 18px;font:400 11px/1.5 "Space Mono",monospace;text-transform:uppercase;transform:rotate(-4deg)}
.tag b{display:block;font:900 22px/1 Archivo,sans-serif;font-variation-settings:'wdth' 125;margin-bottom:6px}
h1{font:900 clamp(44px,9vw,96px)/.94 Archivo,sans-serif;font-variation-settings:'wdth' 125;text-transform:uppercase;letter-spacing:-.02em;margin:28px 0 16px}
h1 span{color:var(--sig)}
p{color:#CFCCC5;margin:0 0 28px}
a{display:inline-flex;align-items:center;min-height:48px;background:var(--sig);color:var(--encre);text-decoration:none;border-radius:999px;padding:0 26px;font:800 14px Archivo,sans-serif;font-variation-settings:'wdth' 112;text-transform:uppercase;letter-spacing:.04em}
</style>
</head>
<body>
<main>
  <span class="tag"><b>VDN®</b>Erreur 404 · Taille introuvable</span>
  <h1>Pièce <span>épuisée.</span></h1>
  <p>Cette page n'existe pas, ou elle a changé d'adresse. La collection, elle, est toujours là.</p>
  <a href="/">Retour à la collection →</a>
</main>
</body>
</html>
